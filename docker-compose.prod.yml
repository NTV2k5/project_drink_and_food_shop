version: '3.8'

services:
  # 1. Reverse Proxy & Edge Caching Layer
  nginx:
    image: nginx:alpine
    container_name: fb_shop_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # 2. Application Node.js Cluster Layer
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fb_shop_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - WEB_CONCURRENCY=4
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - SEPAY_BANK_CODE=${SEPAY_BANK_CODE}
      - SEPAY_ACCOUNT_NO=${SEPAY_ACCOUNT_NO}
      - SEPAY_ACCOUNT_NAME=${SEPAY_ACCOUNT_NAME}
      - SEPAY_WEBHOOK_KEY=${SEPAY_WEBHOOK_KEY}
    command: ["node", "src/cluster.js"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  # 3. High-Speed Distributed Cache & Message Queue Layer
  redis:
    image: redis:7-alpine
    container_name: fb_shop_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  nginx_cache:
  nginx_logs:
  redis_data:
