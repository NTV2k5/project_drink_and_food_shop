user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    log_format main_json escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main_json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # TCP / Network Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting (DDoS & Brute Force Prevention)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Micro-Cache Zone for Read-Heavy Static/Catalog APIs
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:20m max_size=1g inactive=10m use_temp_path=off;

    # Upstream Backend Cluster
    upstream backend_nodes {
        least_conn;
        server backend:4000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream frontend_nodes {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
